[package]
name = "forge-soup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Execution-driven Forge search adapter for SOUP post-training recipes"

[lib]
path = "src/lib.rs"

[dependencies]
forge-core = { path = "../../forge-core" }
forge-bridge = { path = "../../forge-bridge" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
