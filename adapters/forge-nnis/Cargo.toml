[package]
name = "forge-nnis"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-CheckupAuto-Dual"
description = "NNIS execution backend for Forge kernel-agent campaigns"
publish = false

[workspace]
resolver = "2"

[dependencies]
forge-kernel-agent = { path = "../../forge-kernel-agent" }
forge-kernel-search = { path = "../../forge-kernel-search" }
nnis-bench = { git = "https://github.com/Memorithm/NNIS.git", rev = "08b6065e1faa2a5942bb0d6b449cde5dbbad4e5f", package = "nnis-bench" }
nnis-jit = { git = "https://github.com/Memorithm/NNIS.git", rev = "08b6065e1faa2a5942bb0d6b449cde5dbbad4e5f", package = "nnis-jit" }
nnis-kernels = { git = "https://github.com/Memorithm/NNIS.git", rev = "08b6065e1faa2a5942bb0d6b449cde5dbbad4e5f", package = "nnis-kernels" }
nnis-model = { git = "https://github.com/Memorithm/NNIS.git", rev = "08b6065e1faa2a5942bb0d6b449cde5dbbad4e5f", package = "nnis-model" }
nnis-rt = { git = "https://github.com/Memorithm/NNIS.git", rev = "08b6065e1faa2a5942bb0d6b449cde5dbbad4e5f", package = "nnis-rt" }
serde_json = "1"
