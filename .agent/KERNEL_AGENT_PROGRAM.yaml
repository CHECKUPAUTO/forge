phases:
  - id: KA0
    name: Versioned generic kernel-agent contract
    status: completed
    goals:
      - add_forge_kernel_agent_workspace_crate
      - define_task_candidate_numerical_verification_measurement_and_backend_contracts
      - add_unit_tests_for_fail_closed_verification_and_comparability
  - id: KA1
    name: NNIS backend adapter
    status: active
    goals:
      - compile_candidate_source_through_NNIS_NVRTC
      - execute_through_NNIS_runtime_without_PyTorch
      - consume_NNIS_CUDA_event_benchmark_reports
      - preserve_NNIS_environment_fingerprint_compatibility_checks
      - qualify_first_vertical_slice_on_real_NVIDIA_hardware
  - id: KA2
    name: Closed-loop candidate search
    status: planned
    goals:
      - connect_existing_Forge_mutation_and_selection_to_kernel_agent_tasks
      - retain_all_rejections_that_influence_search_policy
      - support_deterministic_seeded_non_LLM_mutation_baseline_before_LLM_claims
  - id: KA3
    name: Transformer kernel campaigns
    status: planned
    goals:
      - RMSNorm_softmax_GEMV_GEMM_RoPE_attention
      - require_destination_owned_oracles_and_real_hardware_measurement
