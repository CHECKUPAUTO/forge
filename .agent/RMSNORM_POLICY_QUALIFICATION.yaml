claim_boundary: >-
  The canonical RMSNorm launch policy is repeatable for its own scalar-gamma
  semantics, but that evidence does not transfer to the decoder weighted
  RMSNorm. The real SmolLM2 weighted-RMSNorm 1x576 campaign verified both paths
  numerically and observed only about 0.515 percent median paired improvement,
  with identical aggregate medians. The block-512 decoder candidate is therefore
  inconclusive and no NNIS runtime promotion or end-to-end speedup claim is
  authorized.
