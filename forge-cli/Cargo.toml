[package]
name = "forge-cli"
version = "0.1.0"
edition = "2021"
description = "CLI d'administration et d'analytics pour forge-core — extraction du front de Pareto, checkpointing et reprise sur crash."

[[bin]]
name = "forge-cli"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
