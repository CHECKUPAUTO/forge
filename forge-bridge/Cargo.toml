[package]
name = "forge-bridge"
version = "0.1.0"
edition = "2021"
description = "Pont d'intégration Forge (moteur évolutionnaire) ↔ SoulSystem"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
forge-core = { path = "../forge-core" }
rand = "0.8"

[features]
default = []
llm = []

[workspace]
license = "LicenseRef-CheckupAuto-Dual"
