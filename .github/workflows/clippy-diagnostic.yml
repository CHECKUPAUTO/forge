name: Clippy diagnostic

on:
  push:
    branches:
      - research/scientific-domain-access-views

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture workspace Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings > /tmp/clippy.txt 2>&1
          status=$?
          cat /tmp/clippy.txt
          echo "$status" > /tmp/clippy-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostic
          path: |
            /tmp/clippy.txt
            /tmp/clippy-status.txt
