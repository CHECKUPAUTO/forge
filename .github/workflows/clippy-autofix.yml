name: Clippy Autofix

on:
  push:
    branches: [chore/forge-hardening-v1]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/forge-hardening-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply targeted cleanup
        shell: python
        run: |
          from pathlib import Path

          p = Path("forge-core/src/evolve.rs")
          text = p.read_text()
          text = text.replace("if let Some(ref c) = cache {", "if let Some(c) = cache {")
          marker = "fn evaluate_distributed_dynamic<C: Candidate>("
          if "#[allow(clippy::too_many_arguments)]\n" + marker not in text:
              if marker not in text:
                  raise SystemExit("distributed evaluator marker missing")
              text = text.replace(marker, "#[allow(clippy::too_many_arguments)]\n" + marker, 1)
          p.write_text(text)

          p = Path("forge/src/binpack.rs")
          text = p.read_text().replace(
              "best.map_or(true, |(_, bp)| p > bp)",
              "best.is_none_or(|(_, bp)| p > bp)",
          )
          p.write_text(text)

          p = Path("forge-domains/src/tensor_train.rs")
          text = p.read_text().replace(
              "assert!(r >= 1 && r <= 4);",
              "assert!((1..=4).contains(&r));",
          )
          p.write_text(text)

          p = Path("forge-core/tests/secure_limits_test.rs")
          text = p.read_text().replace(
              "1 * 1024 * 1024, // 1 MB file size limit",
              "1024 * 1024, // 1 MB file size limit",
          )
          p.write_text(text)
      - name: Validate
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-core/src/evolve.rs forge/src/binpack.rs forge-domains/src/tensor_train.rs forge-core/tests/secure_limits_test.rs
          git commit -m "fix(clippy): clean workspace warnings"
          git push origin HEAD:chore/forge-hardening-v1
