name: Clippy Autofix

on:
  push:
    branches: [chore/forge-hardening-v1]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/forge-hardening-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply targeted cleanup
        shell: python
        run: |
          from pathlib import Path
          p = Path("forge-core/src/evolve.rs")
          text = p.read_text()
          text = text.replace("if let Some(ref c) = cache {", "if let Some(c) = cache {")
          marker = "fn evaluate_distributed_dynamic<C: Candidate>("
          if "#[allow(clippy::too_many_arguments)]\n" + marker not in text:
              if marker not in text:
                  raise SystemExit("distributed evaluator marker missing")
              text = text.replace(marker, "#[allow(clippy::too_many_arguments)]\n" + marker, 1)
          p.write_text(text)
      - name: Validate
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-core/src/evolve.rs
          git commit -m "fix(clippy): clean distributed evaluator"
          git push origin HEAD:chore/forge-hardening-v1
