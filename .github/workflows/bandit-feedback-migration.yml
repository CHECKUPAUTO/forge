name: Bandit Feedback Migration

on:
  push:
    branches: [chore/forge-hardening-v1]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/forge-hardening-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply migration
        run: python3 tools/bandit_feedback_migrate.py
      - name: Remove stale CUDA duplicate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("forge-core/src/domains/cuda_kernel.rs")
          text = p.read_text()
          old = "        let objectives = vec![OBJ.to_string(), OBJ_WEAK.to_string()];\n\n"
          if old not in text:
              raise SystemExit("stale CUDA objectives declaration not found")
          p.write_text(text.replace(old, "", 1))
          PY
      - name: Validate
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p forge-core --lib --features bandit
          cargo clippy -p forge-core --all-targets --features bandit -- -D warnings
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-core/src/evolve.rs forge-core/src/domains/low_rank.rs forge-core/src/domains/simd_kernel.rs forge-core/src/domains/cuda_kernel.rs
          git commit -m "feat(bandit): learn from same-trial execution rewards"
          git push origin HEAD:chore/forge-hardening-v1
