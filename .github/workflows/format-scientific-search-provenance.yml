name: Format scientific search provenance diagnostic

on:
  push:
    branches:
      - research/scientific-search-provenance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/scientific-search-provenance
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Materialize rustfmt output
        run: cargo fmt --all
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-bridge/src/lib.rs forge-bridge/src/scientific_search_provenance.rs
          git commit -m "style(bridge): materialize exact rustfmt output"
          git push origin HEAD:research/scientific-search-provenance
