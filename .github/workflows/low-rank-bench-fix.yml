name: Low Rank Benchmark Fix

on:
  push:
    branches: [chore/forge-hardening-v1]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/forge-hardening-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Tune cold benchmark path
        shell: python
        run: |
          from pathlib import Path
          p = Path("forge-core/src/domains/low_rank.rs")
          text = p.read_text()
          old = '''const BENCH_RS: &str = r#"use criterion::{criterion_group, criterion_main, Criterion, black_box};
          use __CRATE__::{compress, reconstruct};

          fn bench_tensor_train(c: &mut Criterion) {
              let n: usize = __N__;
              let dims: usize = __DIMS__;
              let total: usize = __TOTAL__;
              let shape: Vec<usize> = vec![n; dims];
              let original: Vec<f64> = (0..total).map(|i| (i as f64).cos()).collect();
              // Compression effectuee une fois, hors mesure ; on chronometre la reconstruction.
              let compressed = compress(&original, &shape);
              let mut rebuilt = vec![0.0f64; total];
              c.bench_function("tt_target", |b_run| b_run.iter(|| {
                  reconstruct(black_box(&compressed), black_box(&shape), black_box(&mut rebuilt));
              }));
          }
          criterion_group!(benches, bench_tensor_train);
          criterion_main!(benches);
          "#;'''.replace("          ", "")
          new = '''const BENCH_RS: &str = r#"use criterion::{black_box, criterion_group, criterion_main, Criterion};
          use std::time::Duration;
          use __CRATE__::{compress, reconstruct};

          fn bench_tensor_train(c: &mut Criterion) {
              let n: usize = __N__;
              let dims: usize = __DIMS__;
              let total: usize = __TOTAL__;
              let shape: Vec<usize> = vec![n; dims];
              let original: Vec<f64> = (0..total).map(|i| (i as f64).cos()).collect();
              // Compression effectuee une fois, hors mesure ; on chronometre la reconstruction.
              let compressed = compress(&original, &shape);
              let mut rebuilt = vec![0.0f64; total];
              c.bench_function("tt_target", |b_run| b_run.iter(|| {
                  reconstruct(black_box(&compressed), black_box(&shape), black_box(&mut rebuilt));
              }));
          }
          criterion_group! {
              name = benches;
              config = Criterion::default()
                  .warm_up_time(Duration::from_millis(250))
                  .measurement_time(Duration::from_millis(750))
                  .sample_size(10);
              targets = bench_tensor_train
          }
          criterion_main!(benches);
          "#;'''.replace("          ", "")
          if old not in text:
              raise SystemExit("BENCH_RS pattern not found")
          text = text.replace(old, new, 1)
          if "bench_timeout: Duration::from_secs(60)," not in text:
              raise SystemExit("bench timeout pattern not found")
          text = text.replace(
              "bench_timeout: Duration::from_secs(60),",
              "bench_timeout: Duration::from_secs(120),",
              1,
          )
          p.write_text(text)
      - name: Validate focused path
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p forge-core --test low_rank_tests test_low_rank_measure_returns_three_objectives -- --exact --nocapture
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-core/src/domains/low_rank.rs
          git commit -m "fix(low-rank): bound Criterion runtime on cold workers"
          git push origin HEAD:chore/forge-hardening-v1
