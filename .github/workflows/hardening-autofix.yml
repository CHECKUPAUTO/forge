name: Hardening Autofix

on:
  push:
    branches: [chore/forge-hardening-v1]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/forge-hardening-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply deterministic source migrations
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected pattern missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          replace(
              "forge-domains/examples/train_tt.rs",
              "Config { generations: 30, population: 60, survivors: 8, base_seed: 0xFEED_C0DE }",
              "Config { generations: 30, population: 60, survivors: 8, base_seed: 0xFEED_C0DE, worker_addresses: None }",
          )
          replace(
              "forge-domains/src/tensor_train.rs",
              "Config { generations: 5, population: 20, survivors: 5, base_seed: 123 }",
              "Config { generations: 5, population: 20, survivors: 5, base_seed: 123, worker_addresses: None }",
          )

          p = Path("forge-core/tests/distributed_infra_test.rs")
          text = p.read_text()
          text = text.replace("use std::io::Write;", "use std::io::{Read, Write};")
          marker = "// ---------------------------------------------------------------------------\n// Candidat de stub pour le test\n"
          helpers = r'''fn read_frame<T: serde::de::DeserializeOwned>(stream: &mut std::net::TcpStream) -> T {
              let mut len = [0u8; 4];
              stream.read_exact(&mut len).expect("read frame length");
              let len = u32::from_be_bytes(len) as usize;
              assert!(len > 0 && len <= forge_core::protocol::MAX_MESSAGE_BYTES);
              let mut payload = vec![0u8; len];
              stream.read_exact(&mut payload).expect("read frame payload");
              bincode::deserialize(&payload).expect("decode frame")
          }

          fn write_frame<T: serde::Serialize>(stream: &mut std::net::TcpStream, value: &T) {
              let payload = bincode::serialize(value).expect("encode frame");
              let len = u32::try_from(payload.len()).expect("frame length");
              stream.write_all(&len.to_be_bytes()).expect("write frame length");
              stream.write_all(&payload).expect("write frame payload");
              stream.flush().expect("flush frame");
          }

          '''
          if "fn read_frame<T:" not in text:
              if marker not in text:
                  raise SystemExit("distributed test insertion marker missing")
              text = text.replace(marker, helpers + marker, 1)
          text = text.replace("bincode::deserialize_from(&mut stream)", "Ok(read_frame(&mut stream))")
          text = text.replace(
              "if let Ok(bytes) = bincode::serialize(&result) {\n                            let _ = stream.write_all(&bytes);\n                            let _ = stream.flush();\n                        }",
              "write_frame(&mut stream, &result);",
          )
          text = text.replace(
              "let bytes = bincode::serialize(&result).unwrap();\n                        let _ = stream.write_all(&bytes);\n                        let _ = stream.flush();",
              "write_frame(&mut stream, &result);",
          )
          p.write_text(text)
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit autofix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format workspace and sync stale call sites"
          git push origin HEAD:chore/forge-hardening-v1
