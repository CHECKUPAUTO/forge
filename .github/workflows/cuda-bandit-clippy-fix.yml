name: CUDA Bandit Clippy Fix

on:
  push:
    branches: [chore/forge-hardening-v1]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/forge-hardening-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Remove stale CUDA declaration
        shell: python
        run: |
          from pathlib import Path
          p = Path("forge-core/src/domains/cuda_kernel.rs")
          text = p.read_text()
          old = "        let objectives = vec![OBJ.to_string(), OBJ_WEAK.to_string()];\n\n"
          if old not in text:
              raise SystemExit("stale CUDA objectives declaration not found")
          p.write_text(text.replace(old, "", 1))
      - name: Validate strict bandit path
        run: |
          cargo fmt --all
          cargo clippy -p forge-core --all-targets --features bandit -- -D warnings
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-core/src/domains/cuda_kernel.rs
          git commit -m "fix(cuda): remove stale bandit objective declaration"
          git push origin HEAD:chore/forge-hardening-v1
