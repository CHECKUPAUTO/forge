name: CUDA Bandit Clippy Fix

on:
  push:
    branches: [chore/forge-hardening-v1]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/forge-hardening-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Remove feature-only clippy residues
        shell: python
        run: |
          from pathlib import Path

          cuda = Path("forge-core/src/domains/cuda_kernel.rs")
          text = cuda.read_text()
          old = "        let objectives = vec![OBJ.to_string(), OBJ_WEAK.to_string()];\n\n"
          if old not in text:
              raise SystemExit("stale CUDA objectives declaration not found")
          cuda.write_text(text.replace(old, "", 1))

          for name in ["run_campaign.rs", "run_simd.rs", "run_cuda.rs"]:
              path = Path("forge-core/src/bin") / name
              text = path.read_text().replace(".get(0)", ".first()")
              path.write_text(text)
      - name: Validate strict bandit path
        run: |
          cargo fmt --all
          cargo clippy -p forge-core --all-targets --features bandit -- -D warnings
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-core/src/domains/cuda_kernel.rs forge-core/src/bin/run_campaign.rs forge-core/src/bin/run_simd.rs forge-core/src/bin/run_cuda.rs
          git commit -m "fix(clippy): clean feature-gated runner warnings"
          git push origin HEAD:chore/forge-hardening-v1
